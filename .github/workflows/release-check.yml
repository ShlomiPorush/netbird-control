name: Release Check

# Runs on every pull request to main. A pull request that changes VERSION is a release pull
# request (opened by scripts/release.sh) and must be releasable once merged; any other pull
# request only runs the changelog helper tests. It also runs when a pull request is edited, so a
# pull request moved to main (as when the pull request under it in a stack is merged) is checked.
# Read-only: no secrets, no publishing.
on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (not mutable tags) so a repointed tag
      # can't inject code into the build - the trailing comment tracks the version.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the release helpers
        run: node --test .github/scripts/changelog.test.js .github/scripts/image-labels.test.js

      # The checkout is GitHub's test merge commit (base + this pull request): NEW is the VERSION
      # of that merge, and its first parent is the base it was built on. OLD is read from that
      # parent, not from pull_request.base.sha: base.sha can stay at the base the pull request
      # started from, so a pull request that is behind main across a release would compare main's
      # new VERSION with an old one and look like a release.
      # The guards fail the step instead of guessing: when the checkout is not that merge commit,
      # when its base can't be confirmed to be part of the base branch, and, after the base branch
      # was changed, when the merge was not built on the new base branch's current tip.
      - name: Check the release version
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_CHANGED_FROM: ${{ github.event.changes.base.ref.from }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          CL=.github/scripts/changelog.js
          RETRY="push to the pull request's branch ($HEAD_REF), or close and reopen the pull request, for a fresh test merge"
          if [ "$(git rev-parse -q --verify 'HEAD^2' || true)" != "$HEAD_SHA" ]; then
            echo "::error::Could not confirm that the checkout is the test merge commit of $HEAD_SHA, so the base VERSION is unknown - $RETRY"
            exit 1
          fi
          BASE_TIP=refs/remotes/origin/$BASE_REF
          if ! git merge-base --is-ancestor HEAD^1 "$BASE_TIP"; then
            echo "::error::Could not confirm that the test merge base $(git rev-parse HEAD^1) is part of $BASE_REF - $RETRY"
            exit 1
          fi
          if [ -n "$BASE_CHANGED_FROM" ] && [ "$(git rev-parse HEAD^1)" != "$(git rev-parse "$BASE_TIP")" ]; then
            echo "::error::The base branch changed from $BASE_CHANGED_FROM, and the test merge was not built on the current tip of $BASE_REF - $RETRY"
            exit 1
          fi
          NEW=$(tr -d '[:space:]' < VERSION)
          OLD=$(git show HEAD^1:VERSION | tr -d '[:space:]')
          if [ "$NEW" = "$OLD" ]; then
            echo "VERSION is unchanged ($NEW): not a release pull request."
            exit 0
          fi
          echo "Release pull request: $OLD -> $NEW"
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::VERSION can only change in a release branch of $GITHUB_REPOSITORY, not from $HEAD_REPO"
            exit 1
          fi
          if [ "$HEAD_REF" != "release/v$NEW" ]; then
            echo "::error::VERSION changed to $NEW, so the branch must be release/v$NEW (it is $HEAD_REF). Use scripts/release.sh."
            exit 1
          fi
          node "$CL" check-version "$NEW"
          node "$CL" gt "$NEW" "$OLD"
          # A failed ls-remote fails the step (bash -e) instead of reading as "no tag".
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/v$NEW")
          if [ -n "$REMOTE_TAG" ]; then
            echo "::error::Tag v$NEW already exists"
            exit 1
          fi
          node "$CL" section "$NEW" > /dev/null
          echo "v$NEW is ready to release when this pull request is merged."
