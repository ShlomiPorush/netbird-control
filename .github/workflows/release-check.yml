name: Release Check

# Runs on every pull request to main. A pull request that changes VERSION is a release pull
# request (opened by scripts/release.sh) and must be releasable once merged; any other pull
# request only runs the changelog helper tests. It also runs when a pull request is edited, so a
# pull request moved to main (as when the pull request under it in a stack is merged) is checked.
# Read-only: no secrets, no publishing.
on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (not mutable tags) so a repointed tag
      # can't inject code into the build - the trailing comment tracks the version.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the changelog helper
        run: node --test .github/scripts/changelog.test.js

      # The checkout is GitHub's test merge commit (base + this pull request), so NEW is the
      # VERSION main will have after the merge, and the merge commit's first parent is the base it
      # was built on. OLD is read from that parent, not from pull_request.base.sha: base.sha can
      # stay at the base the pull request started from, so a pull request that is behind main
      # across a release would compare main's new VERSION with an old one and look like a release.
      # The guards fail the step instead of guessing when the checkout is not that merge commit,
      # or when it was built on a base that is not part of the current base branch.
      - name: Check the release version
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          CL=.github/scripts/changelog.js
          if [ "$(git rev-parse -q --verify 'HEAD^2' || true)" != "$HEAD_SHA" ]; then
            echo "::error::The checkout is not the test merge commit of $HEAD_SHA - cannot tell which VERSION the base has"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD^1 "origin/$BASE_REF"; then
            echo "::error::The test merge commit was built on $(git rev-parse HEAD^1), which is not in $BASE_REF - push to the branch or close and reopen the pull request for a fresh merge commit"
            exit 1
          fi
          NEW=$(tr -d '[:space:]' < VERSION)
          OLD=$(git show HEAD^1:VERSION | tr -d '[:space:]')
          if [ "$NEW" = "$OLD" ]; then
            echo "VERSION is unchanged ($NEW): not a release pull request."
            exit 0
          fi
          echo "Release pull request: $OLD -> $NEW"
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::VERSION can only change in a release branch of $GITHUB_REPOSITORY, not from $HEAD_REPO"
            exit 1
          fi
          if [ "$HEAD_REF" != "release/v$NEW" ]; then
            echo "::error::VERSION changed to $NEW, so the branch must be release/v$NEW (it is $HEAD_REF). Use scripts/release.sh."
            exit 1
          fi
          node "$CL" check-version "$NEW"
          node "$CL" gt "$NEW" "$OLD"
          # A failed ls-remote fails the step (bash -e) instead of reading as "no tag".
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/v$NEW")
          if [ -n "$REMOTE_TAG" ]; then
            echo "::error::Tag v$NEW already exists"
            exit 1
          fi
          node "$CL" section "$NEW" > /dev/null
          echo "v$NEW is ready to release when this pull request is merged."
