services:
  netbird:
    image: netbirdio/netbird:latest
    container_name: netbird-routing-peer
    restart: unless-stopped
    # Host networking: the routing peer sits directly on the VM's network - no Docker
    # NAT layer. The old bridge put it behind a DOUBLE NAT (Docker + the upstream router),
    # which killed hole punching and forced every connection to it onto TCP relays.
    # NOTE: only ONE NetBird container per VM may run in host mode (a second would
    # fight over the wt0 interface and ports) - the exit-node and proxy containers
    # stay on their bridge networks. `hostname:` is not allowed with host networking,
    # so the peer will take the VM's hostname (cosmetic - identity is preserved by
    # the ./data volume; groups and policies follow the peer, not its name).
    #
    # Before deploying, on the VM itself:
    #   1. IP forwarding (in host mode the VM forwards, not the container netns).
    #      Docker usually enables it already - verify with: sysctl net.ipv4.ip_forward
    #      Persist it by creating a one-line file:
    #        echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/99-netbird.conf
    #        sudo sysctl --system
    #   2. Host firewall: allow outbound UDP (stun/turn.netbird.io 80/443/3478/5555
    #      + the dynamic WireGuard port). No inbound rules are required.
    network_mode: host
    volumes:
      - ./data:/var/lib/netbird
    environment:
      - NB_SETUP_KEY=${SETUP_KEY}
    # Kernel TUN device - without it the client silently falls back to the slower
    # userspace (netstack) mode and never creates a real wt0 on the host.
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - SYS_ADMIN
