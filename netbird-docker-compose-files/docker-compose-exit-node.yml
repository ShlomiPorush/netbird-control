# Pinned project name: Compose commands for this file never touch the routing peer, whose
# service is also called netbird, even if both folders have the same name.
name: netbird-exit-node

services:
  netbird:
    image: netbirdio/netbird:latest
    container_name: netbird-exit-node
    hostname: netbird-exit-node
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/netbird
    # DELIBERATELY kept on a bridge network (do NOT switch to host mode): the LAN
    # isolation depends on firewall rules that match this network's bridge interface,
    # which host networking would bypass entirely. Exit-node connections stay relayed -
    # that is an accepted trade-off; the isolation matters more than browsing latency.
    networks:
      - netbird-exit-node
    # Public DNS ON PURPOSE: without dns:, Docker can send the exit node's lookups from the VM
    # to the VM's own DNS server, which is often internal and is outside the isolation rules.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - NB_SETUP_KEY=${SETUP_KEY}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - SYS_ADMIN

networks:
  netbird-exit-node:
    name: netbird-exit-node
    driver: bridge
    # The isolation rules cover IPv4 only, so this network must never get IPv6.
    enable_ipv6: false
    driver_opts:
      # Pinned bridge name ON PURPOSE - the isolation rules match this interface.
      # Change it only together with BRIDGE in exit-node-isolation/netbird-exit-isolation.sh.
      # Keep this network for the exit node alone.
      com.docker.network.bridge.name: br-nb-exit
    ipam:
      config:
        - subnet: 172.20.0.0/24

# ─── REQUIRED companion rules on the VM (NOT enforced by this file!) ───
# A user enabling this Exit Node routes 0.0.0.0/0 through a container that sits
# inside your internal network - without the rules they would implicitly reach
# internal resources and bypass every NetBird policy. Install exit-node-isolation/
# on the VM before you start this file: see "Isolate the Exit Node" in README.md.
